<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Stack Tower - How High Can You Go?</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas"></canvas>

      <div id="ui-overlay">
        <div id="score">0</div>
        <div id="combo"></div>
      </div>

      <div id="start-screen" class="screen">
        <h1>🗼 STACK TOWER</h1>
        <p class="subtitle">How high can you go?</p>
        <div class="instructions">
          <p>Tap or click to stack the blocks</p>
          <p>Stack perfectly for bonus points!</p>
        </div>
        <button id="start-btn" class="btn pulse">TAP TO START</button>
        <div class="high-score">
          Best: <span id="high-score-display">0</span>
        </div>
      </div>

      <div id="game-over-screen" class="screen hidden">
        <h1>GAME OVER</h1>
        <div class="final-score">
          <p>Score</p>
          <span id="final-score">0</span>
        </div>
        <div class="stats">
          <div class="stat">
            <span class="stat-label">Best</span>
            <span id="best-score">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Perfects</span>
            <span id="perfect-count">0</span>
          </div>
        </div>
        <button id="restart-btn" class="btn">PLAY AGAIN</button>
        <button id="share-btn" class="btn secondary">SHARE SCORE</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
