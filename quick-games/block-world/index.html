<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block World - Open World Adventure</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-container">
      <div id="menu-screen">
        <h1>⛏️ BLOCK WORLD ⛏️</h1>
        <h2>Open World Adventure</h2>
        <div class="menu-info">
          <p>🎮 WASD to move, SPACE to jump</p>
          <p>🖱️ Left click to break blocks</p>
          <p>🖱️ Right click to place blocks</p>
          <p>🔢 1-9 keys to select inventory slot</p>
          <p>🌍 Explore the infinite world!</p>
        </div>
        <button id="start-btn">START ADVENTURE</button>
      </div>

      <canvas id="game-canvas"></canvas>

      <div id="hud" class="hidden">
        <div id="health-bar">
          <div id="health-hearts"></div>
        </div>
        <div id="hunger-bar">
          <div id="hunger-icons"></div>
        </div>
        <div id="hotbar">
          <!-- Inventory slots will be generated by JS -->
        </div>
        <div id="coordinates">
          X: <span id="coord-x">0</span> Y: <span id="coord-y">0</span>
        </div>
        <div id="time-display">
          <span id="day-night-icon">☀️</span>
          <span id="day-count">Day 1</span>
        </div>
      </div>

      <div id="crosshair">+</div>

      <div id="block-preview" class="hidden">
        <span id="preview-name">Dirt</span>
      </div>

      <div id="game-over" class="hidden">
        <h1>YOU DIED</h1>
        <p>Score: <span id="final-score">0</span></p>
        <button id="respawn-btn">RESPAWN</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
