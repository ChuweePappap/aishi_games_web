<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battle Royale - Last One Standing</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-container">
      <div id="menu-screen">
        <h1>⚔️ BATTLE ROYALE ⚔️</h1>
        <h2>Last One Standing</h2>
        <div class="menu-info">
          <p>🎮 WASD or Arrow Keys to move</p>
          <p>🖱️ Mouse to aim & click to shoot</p>
          <p>📦 Walk over loot to pick up</p>
          <p>⚠️ Stay inside the safe zone!</p>
        </div>
        <button id="start-btn">DROP IN!</button>
        <div class="players-alive">
          <span>Players: 20</span>
        </div>
      </div>

      <canvas id="game-canvas"></canvas>

      <div id="hud" class="hidden">
        <div id="health-bar">
          <div id="health-fill"></div>
          <span id="health-text">100</span>
        </div>
        <div id="shield-bar">
          <div id="shield-fill"></div>
          <span id="shield-text">0</span>
        </div>
        <div id="weapon-info">
          <span id="weapon-name">Pistol</span>
          <span id="ammo-count">∞</span>
        </div>
        <div id="players-left">
          <span>👥 Alive: </span><span id="alive-count">20</span>
        </div>
        <div id="kill-count">
          <span>💀 Kills: </span><span id="kills">0</span>
        </div>
        <div id="zone-warning" class="hidden">⚠️ GET TO THE SAFE ZONE! ⚠️</div>
      </div>

      <div id="game-over" class="hidden">
        <h1 id="result-title">GAME OVER</h1>
        <div id="stats">
          <p>Position: #<span id="final-position">1</span></p>
          <p>Kills: <span id="final-kills">0</span></p>
          <p>Damage Dealt: <span id="final-damage">0</span></p>
        </div>
        <button id="restart-btn">PLAY AGAIN</button>
      </div>

      <div id="kill-feed"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
